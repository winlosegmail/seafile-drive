name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Fix Android Namespace
        run: |
          # Extrai o nome do pacote do AndroidManifest
          PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml)
          echo "Pacote encontrado: $PACKAGE_NAME"
          # Injeta a regra do namespace dentro do bloco 'android' no build.gradle
          sed -i "/android {/a \    namespace '$PACKAGE_NAME'" app/build.gradle

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeafileDrive-APK
          path: app/build/outputs/apk/release/app-release.apk
